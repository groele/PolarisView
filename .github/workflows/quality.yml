name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scientific-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run test:browser
