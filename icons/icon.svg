<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景渐变 -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- 偏振四瓣花样发光渐变 -->
    <linearGradient id="lobeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- 快轴光芒渐变 -->
    <linearGradient id="axisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- 辉光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="petalGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feComposite in="SourceGraphic" in2="blur2" operator="over"/>
    </filter>
  </defs>

  <!-- 图标圆角矩形底板 (iOS/macOS 现代 Squircle 规范) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="3"/>

  <!-- 极坐标网格圆环 (Concentric Polar Grid) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(148, 163, 184, 0.18)" stroke-width="2"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(148, 163, 184, 0.22)" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="256" cy="256" r="80"  fill="none" stroke="rgba(148, 163, 184, 0.25)" stroke-width="2"/>

  <!-- 8 条极坐标放射角线 (0°, 45°, 90°, 135°, 180°, 225°, 270°, 315°) -->
  <g stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5">
    <line x1="56" y1="256" x2="456" y2="256"/>
    <line x1="256" y1="56" x2="256" y2="456"/>
    <line x1="115" y1="115" x2="397" y2="397"/>
    <line x1="397" y1="115" x2="115" y2="397"/>
  </g>

  <!-- 偏振四瓣花样底影辉光 (Luminous 4-Lobe Clover / Polarization Pattern) -->
  <path d="M 256 256 C 256 120 300 80 256 80 C 212 80 256 120 256 256 C 392 256 432 300 432 256 C 432 212 392 256 256 256 C 256 392 212 432 256 432 C 300 432 256 392 256 256 C 120 256 80 212 80 256 C 80 300 120 256 256 256 Z"
        fill="none"
        stroke="rgba(56, 189, 248, 0.4)"
        stroke-width="28"
        filter="url(#petalGlow)"/>

  <!-- 偏振四瓣主体矢量瓣 (Primary 4-Lobe Polar Intensity Curve) -->
  <path d="M 256 256 C 285 140 330 85 256 85 C 182 85 227 140 256 256 C 372 285 427 330 427 256 C 427 182 372 227 256 256 C 227 372 182 427 256 427 C 330 427 285 372 256 256 C 140 227 85 182 85 256 C 85 330 140 285 256 256 Z"
        fill="url(#lobeGrad)"
        fill-opacity="0.35"
        stroke="url(#lobeGrad)"
        stroke-width="7"
        filter="url(#glow)"/>

  <!-- 1/2 波片快轴偏振指示矢量 (Fast-Axis Orientation Vector θ0) -->
  <g filter="url(#glow)">
    <line x1="120" y1="392" x2="392" y2="120" stroke="url(#axisGrad)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="392" cy="120" r="8" fill="#fbbf24"/>
    <circle cx="120" cy="392" r="6" fill="#f59e0b"/>
  </g>

  <!-- 中心光学原点与激光光斑 (Laser Beam Spot) -->
  <circle cx="256" cy="256" r="14" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="6" fill="#ffffff"/>
</svg>
